[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-task-watcher"
version = "1.0.0"
description = "ATW — zero-LLM local task watcher with AFHP/1 file handoff and DingTalk notifications"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ATW Project" }]
keywords = ["agent", "monitoring", "psutil", "dingtalk", "task-watcher"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "psutil>=5.9.8",
  "pydantic>=2.6,<3",
  "PyYAML>=6.0.1",
  "httpx>=0.27",
  "typer>=0.12",
  "watchdog>=4.0",
  "nvidia-ml-py>=12.535.108",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "jsonschema>=4.21",
  "ruff>=0.5",
  "pyinstaller>=6.6",
]

[project.scripts]
atw = "atw.cli.app:main"

[project.urls]
Homepage = "https://github.com/example/agent-task-watcher"
Documentation = "https://github.com/example/agent-task-watcher/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/atw"]

[tool.hatch.build.targets.sdist]
include = [
  "src/atw",
  "schemas",
  "examples",
  "skills",
  "deploy",
  "docs",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "e2e: end-to-end tests that spawn real processes",
  "linux: tests that only run on Linux",
  "windows: tests that only run on Windows",
  "gpu: tests that require an NVIDIA GPU / NVML",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's command signature intentionally uses Option()/Argument() defaults.
"src/atw/cli/app.py" = ["B008"]

[tool.coverage.run]
source = ["atw"]
